<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Model Viewer with Explosion Effect</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #explodeButton {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #f00;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        #resetButton {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0f0;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #000;
            z-index: 100;
        }
    </style>
</head>
<body>
<button id="explodeButton">Explode Model</button>
<button id="resetButton">Reset Model</button>
<div id="loadingOverlay">Loading model...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js "></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js "></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js "></script>
<script>
    let scene, camera, renderer, controls;
    let mixer, model;
    let isExploding = false;
    let particles;

    init();
    animate();

    function init() {
        // 创建场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        // 创建相机
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // 创建渲染器
        renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 添加窗口大小调整事件监听器
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 加载 GLB 模型
        const loadingManager = new THREE.LoadingManager();
        loadingManager.onProgress = function (url, loaded, total) {
            console.log('Loading: ' + (loaded / total * 100) + '%');
        };
        loadingManager.onLoad = function () {
            document.getElementById('loadingOverlay').style.display = 'none';
        };
        const loader = new THREE.GLTFLoader(loadingManager);
        loader.load('日晷.glb', function(gltf) {
            model = gltf.scene;
            scene.add(model);

            // 如果模型有动画，创建动画混合器
            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    mixer.clipAction(clip).play();
                });
            }
        }, undefined, function(error) {
            console.error(error);
        });

        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // 添加方向光
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        scene.add(directionalLight);

        // 创建轨道控制器
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.25;
        controls.enableZoom = true;

        // 监听双击事件
        renderer.domElement.addEventListener('dblclick', onDoubleClick, false);

        // 监听爆炸按钮点击事件
        document.getElementById('explodeButton').addEventListener('click', explodeModel);

        // 监听重置按钮点击事件
        document.getElementById('resetButton').addEventListener('click', resetModel);
    }

    function onDoubleClick(event) {
        event.preventDefault();
        if (model) {
            // 放大模型
            model.scale.multiplyScalar(1.5);
        }
    }

    function animate() {
        requestAnimationFrame(animate);

        if (mixer) mixer.update(1 / 60);
        if (isExploding) controls.update();

        renderer.render(scene, camera);
    }

    function explodeModel() {
        if (!model || isExploding) return;
        isExploding = true;

        // 简单的爆炸效果：将模型的子对象分散开
        model.traverse(function(child) {
            if (child.isMesh) {
                child.userData.velocity = new THREE.Vector3(
                    Math.random() * 2 - 1,
                    Math.random() * 2 - 1,
                    Math.random() * 2 - 1
                );
                child.material.opacity = 1.0;
                child.material.transparent = true;
            }
        });

        const explodeAnimation = function() {
            let allFaded = true;

            model.traverse(function(child) {
                if (child.isMesh) {
                    child.position.add(child.userData.velocity);
                    child.material.opacity -= 0.01;
                    if (child.material.opacity > 0) allFaded = false;
                }
            });

            if (!allFaded) {
                requestAnimationFrame(explodeAnimation);
            } else {
                isExploding = false;
                // 这里你可以选择从场景中移除模型或执行其他操作
            }
        };

        explodeAnimation();
    }

    function resetModel() {
        if (!model) return;

        // 重置模型位置和透明度
        model.traverse(function(child) {
            if (child.isMesh) {
                child.position.set(0, 0, 0);
                child.material.opacity = 1.0;
                child.material.transparent = false;
                delete child.userData.velocity;
            }
        });

        isExploding = false;
    }
</script>
</body>
</html>
